name: auto check

on:
  workflow_dispatch:
  push:
    # 默认分支已由 master 改名为 main。这里改回 main 后才与分支名一致。
    # (历史教训: 2023-08-17 建文件起这里一直写 [main], 而仓库实际分支叫 master,
    #  导致 push 触发从未生效 —— 历史 27 次运行里 push 事件 0 次。)
    branches: [ main ]
    paths-ignore:
      - 'README.md'
  schedule:
    # cron 用的是 UTC, 北京时间 = UTC + 8。故意错开整点: GitHub 文档明确说 schedule
    # 是 best-effort, 整点高峰会延迟甚至直接丢弃; 2026-08 底起还有大范围漂移事件。
    # 实测本仓库的 schedule 事件会迟到 3~10 小时 (workflow_dispatch 则秒级启动),
    # 所以一天留 4 个槽位互为兜底。第一个成功的槽位签到, 后面的槽位会直接跳过
    # (见下面的「今天是否已经签到成功」), 所以多留槽位既不会重复签到也不会重复扣分。
    - cron: '7 16 * * *'   # 16:07 UTC = 北京 00:07, 刚好越过账户签到日界点, 是当天第一次
    - cron: '23 22 * * *'  # 22:23 UTC = 北京 06:23, 凌晨兜底
    - cron: '41 4 * * *'   # 04:41 UTC = 北京 12:41, 第二锚点
    - cron: '13 10 * * *'  # 10:13 UTC = 北京 18:13, 白天兜底

jobs:
  build:
    name: glados/railgun checkin
    runs-on: ubuntu-latest
      
    permissions:
      contents: read
      actions: write

    strategy:
      matrix:
        python-version: [3.13]

    # 这里加入全局环境变量，强制后续所有第三方 actions 兼容 Node.js 24 运行环境
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: true

    steps:
    - name: Checkout Code
      uses: actions/checkout@v6

    # 4 个槽位互为兜底, 但一天只需要签到成功一次。成功之后后面的槽位直接跳过,
    # 不再打重复签到。
    # 标记就是 GitHub 自己的运行记录: 北京时间「今天」本工作流有没有成功运行过。
    # 脚本是 fail-closed 的 (只有签到成功 code 0 / 重复签到 code 1 才退出 0),
    # 所以「今天有成功运行」等价于「今天已经签到成功」。
    # 查询失败时回退为照常签到 —— 宁可多签一次, 也绝不静默漏签。
    - name: 今天是否已经签到成功
      id: today
      env:
        GH_TOKEN: ${{ github.token }}
      run: |
        # 手动触发不跳过: 手动点意味着「现在就跑一次」, 否则排查问题时会被静默跳过。
        if [ "${GITHUB_EVENT_NAME}" = "workflow_dispatch" ]; then
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 手动触发, 不跳过, 照常签到。"
          exit 0
        fi
        # 北京时间今天 00:00 对应的 UTC 时刻 (北京 = UTC+8)。
        # 必须用 python 算, 不能用 GNU date:
        #   TZ=Asia/Shanghai date -d 'today 00:00' -u
        # 里的 -u 会把「输入解析」也切成 UTC, 得到的是 UTC 零点而不是北京零点,
        # 窗口因此往前多算 16 小时 —— 新的一天会误判成「昨天已签到」而整日跳过。
        since=$(python3 - <<'PY'
        import datetime as dt
        bj = dt.timezone(dt.timedelta(hours=8))
        midnight = dt.datetime.now(bj).replace(hour=0, minute=0, second=0, microsecond=0)
        print(midnight.astimezone(dt.timezone.utc).strftime("%Y-%m-%dT%H:%M:%SZ"))
        PY
        )
        count=0
        if raw=$(gh api -X GET \
              "repos/${GITHUB_REPOSITORY}/actions/workflows/gladosCheck.yml/runs" \
              -f status=success -f "created=>=${since}" --jq '.total_count' 2>/dev/null); then
          count=${raw:-0}
        else
          echo "::warning::查询今天的成功运行记录失败, 无法判断是否已签到, 回退为照常签到。"
        fi
        case "${count}" in ''|*[!0-9]*) count=0 ;; esac
        echo "北京时间今天 00:00 = ${since} (UTC)"
        echo "本工作流今天的成功运行数: ${count}"
        if [ "${count}" -gt 0 ]; then
          echo "skip=true" >> "$GITHUB_OUTPUT"
          echo "✅ 今天已经签到成功过, 跳过本次签到。"
        else
          echo "skip=false" >> "$GITHUB_OUTPUT"
          echo "ℹ️ 今天还没有成功记录, 执行签到。"
        fi

    - name: Set up Python ${{ matrix.python-version }}
      if: steps.today.outputs.skip != 'true'
      uses: actions/setup-python@v6
      with:
        python-version: ${{ matrix.python-version }}

    # 安装 python 库
    - name: Install dependencies
      if: steps.today.outputs.skip != 'true'
      run: |
        python -m pip install --upgrade pip
        pip install requests

    # 执行签到脚本；失败时仍保留原有的非 0 退出码和 GitHub 失败邮件。
    - name: Running checkin
      id: checkin
      if: steps.today.outputs.skip != 'true'
      run: |
        set -o pipefail
        python checkin.py 2>&1 | tee "$RUNNER_TEMP/glados-checkin.log"
      env:
        GLADOS_COOKIES: ${{ secrets.GLADOS_COOKIES }}
        GLADOS_EXCHANGE_PLAN: ${{ secrets.GLADOS_EXCHANGE_PLAN }}
        # 汇总中需要积分、剩余天数和兑换结果；通知只提取汇总，不转发原始日志。
        GLADOS_VERBOSE: 'true'
        # GLaDOS 会校验签到请求的平台是否与登录浏览器一致, 平台不符会被判定为自动签到 (code 4)
        GLADOS_USER_AGENT: ${{ secrets.GLADOS_USER_AGENT }}

    # 仅在当天实际需要签到时发送一次应用消息；签到失败也要执行通知。
    # 通知故障不改变签到结果，避免成功签到被误判为失败并在下一槽位重复执行。
    - name: 企业微信应用通知
      if: always() && steps.today.outputs.skip == 'false'
      continue-on-error: true
      env:
        # JSON: {"corp_id":"...","app_secret":"...","agent_id":1000002,"to_user":"..."}
        WECOM_CONFIG: ${{ secrets.WECOM_CONFIG }}
        CHECKIN_OUTCOME: ${{ steps.checkin.outcome }}
      run: |
        python3 - <<'PY'
        import json
        import os
        import re
        import sys
        import urllib.parse
        import urllib.request
        from datetime import datetime, timedelta, timezone
        from pathlib import Path

        if not os.environ.get('WECOM_CONFIG'):
            print('::warning::未配置 WECOM_CONFIG，跳过企业微信应用通知。')
            sys.exit(0)

        def request(url, payload=None):
            data = None if payload is None else json.dumps(payload, ensure_ascii=False).encode('utf-8')
            headers = {} if data is None else {'Content-Type': 'application/json; charset=utf-8'}
            with urllib.request.urlopen(urllib.request.Request(url, data=data, headers=headers), timeout=15) as response:
                return json.load(response)

        try:
            config = json.loads(os.environ['WECOM_CONFIG'])
            required = ('corp_id', 'app_secret', 'agent_id', 'to_user')
            if not isinstance(config, dict) or any(not config.get(key) for key in required):
                raise ValueError('WECOM_CONFIG 缺少必填字段')
            query = urllib.parse.urlencode({
                'corpid': config['corp_id'],
                'corpsecret': config['app_secret'],
            })
            token_result = request('https://qyapi.weixin.qq.com/cgi-bin/gettoken?' + query)
            if token_result.get('errcode') != 0 or not token_result.get('access_token'):
                raise ValueError('获取 access_token 失败，errcode=' + str(token_result.get('errcode')))

            outcome = os.environ.get('CHECKIN_OUTCOME')
            status = '成功' if outcome == 'success' else '失败' if outcome == 'failure' else '未执行'
            color = 'info' if outcome == 'success' else 'warning'
            now = datetime.now(timezone(timedelta(hours=8))).strftime('%Y-%m-%d %H:%M')
            run_url = (f"https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/"
                       f"{os.environ['GITHUB_RUN_ID']}")
            log_path = Path(os.environ['RUNNER_TEMP']) / 'glados-checkin.log'
            log = log_path.read_text(encoding='utf-8', errors='replace') if log_path.exists() else ''
            counts = re.search(r'GLaDOS 签到, 成功(\d+), 失败(\d+), 重复(\d+)', log)
            sites = re.findall(
                r'🍪\[(\d+)\]\s+🌐\[(glados\.cloud|railgun\.info)\].*?结果:\s*([^\n]+)', log
            )
            results = re.findall(
                r'^#(\d+) P:(.*?) 剩余:(.*?) 总积分:(.*?) \| (.*?) \| (.*)$', log, re.M
            )

            def clean(value):
                # 服务端文字只作为普通文本展示，不允许插入 Markdown/HTML。
                return re.sub(r'[<>&`*_\[\]()#|]', ' ', ' '.join(value.split()))[:80]

            header = [
                '# GLaDOS 签到报告',
                f'> 执行结果：<font color="{color}">{status}</font>',
                f'> 北京时间：{now}',
            ]
            if counts:
                header.append(f'> 站点统计：成功 {counts[1]} / 重复 {counts[3]} / 失败 {counts[2]}')
            sections = []
            for position, earned, days, total, site_status, exchange in results:
                index = int(position) - 1
                account, domain = sites[index][:2] if index < len(sites) else (str(index // 2 + 1), '站点')
                section = [f'### 账号 {account} · {domain}', f'> 签到：{clean(site_status)}']
                if days != 'None 天' or total != 'None 积分':
                    section.append(f'> 获得积分：{clean(earned)} · 剩余：{clean(days)} · 总积分：{clean(total)}')
                if exchange != '未兑换':
                    section.append(f'> 兑换：{clean(exchange)}')
                sections.append('\n'.join(section))
            if not sections:
                sections = ['> 未生成签到明细，请查看运行日志。']

            footer = f'\n[查看完整运行日志]({run_url})'
            pages = []
            current = '\n'.join(header)
            for section in sections:
                candidate = current + '\n' + section
                if len((candidate + footer).encode('utf-8')) > 2048:
                    pages.append(current + footer)
                    current = '# GLaDOS 签到报告（续）\n' + section
                else:
                    current = candidate
            pages.append(current + footer)
            send_query = urllib.parse.urlencode({'access_token': token_result['access_token']})
            for content in pages:
                message = {
                    'touser': config['to_user'],
                    'msgtype': 'markdown',
                    'agentid': int(config['agent_id']),
                    'markdown': {'content': content},
                }
                send_result = request('https://qyapi.weixin.qq.com/cgi-bin/message/send?' + send_query, message)
                if send_result.get('errcode') != 0:
                    raise ValueError('发送应用消息失败，errcode=' + str(send_result.get('errcode')))
            print(f'企业微信 Markdown 通知已发送，共 {len(pages)} 条。')
        except Exception as exc:
            # 异常可能包含带凭据的请求 URL，日志只输出异常类型。
            print(f'::warning::企业微信应用通知失败（{type(exc).__name__}），请检查应用配置和运行日志。')
            sys.exit(1)
        PY

    # 签到失败时, 这两个收尾步骤也要照跑:
    # 用 if: always() 保证 keepalive 不会因为签到红了就被跳过, 否则工作流可能被
    # GitHub 判定为长期不活动而自动停用。作业本身仍会因为上面步骤失败而保持红色。
    - name: Keep alive
      if: always()
      uses: liskin/gh-workflow-keepalive@v1 
        
    - name: Delete workflow runs
      if: always()
      uses: Mattraks/delete-workflow-runs@v2
      with:
        token: ${{ github.token }}
        repository: ${{ github.repository }}
        # 保留更长的历史: schedule 漂移需要连续多天的触发时间才能看出来,
        # 原来 7 天会把排查漂移最需要的记录删掉。
        retain_days: 30
        keep_minimum_runs: 30
        delete_run_by_conclusion_pattern: success
